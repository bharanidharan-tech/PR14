
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CosmoQuest - Space Quiz</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Outfit', Arial, sans-serif;
    min-height: 100vh;
    background: radial-gradient(
        ellipse at 20% 20%,
        #243b80 0%,
        #101735 40%,
        #050816 100%
    );
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px;
    overflow-x: hidden;
}

/* ANIMATED STAR BACKGROUND */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    0% {
        opacity: 0.2;
        transform: scale(0.6);
    }
    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* GLOWING BACKGROUND ORBS */
.orb {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.28;
    pointer-events: none;
}

.orb-one {
    background: #7c3aed;
    top: -100px;
    left: -100px;
}

.orb-two {
    background: #06b6d4;
    bottom: -130px;
    right: -80px;
}

/* MAIN CONTAINER */
.quiz-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 800px;
}

/* BRAND */
.brand {
    text-align: center;
    margin-bottom: 25px;
}

.brand-icon {
    font-size: 45px;
    margin-bottom: 8px;
}

.brand h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(
        90deg, #c4b5fd, #67e8f9
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.brand p {
    color: #a5b4d4;
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* GLASS QUIZ CARD */
.quiz-card {
    background: rgba(20, 27, 58, 0.82);
    border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 24px;
    padding: 38px;
    box-shadow:
        0 25px 70px rgba(0,0,0,0.35),
        0 0 45px rgba(124,58,237,0.1);
    backdrop-filter: blur(20px);
}

/* TOP BAR */
.quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
}

.question-count {
    color: #c4b5fd;
    font-size: 15px;
    font-weight: 600;
}

.score-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(124,58,237,0.18);
    border: 1px solid rgba(167,139,250,0.25);
    padding: 10px 18px;
    border-radius: 30px;
}

.score-box span {
    color: #c4b5fd;
    font-size: 14px;
}

.score-box strong {
    font-size: 22px;
    color: #67e8f9;
}

/* PROGRESS BAR */
.progress-track {
    width: 100%;
    height: 9px;
    background: #293154;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 38px;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(
        90deg, #8b5cf6, #22d3ee
    );
    border-radius: 20px;
    transition: width 0.4s ease;
}

/* QUESTION */
.question-label {
    color: #67e8f9;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.question-text {
    font-size: 27px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 30px;
    min-height: 80px;
}

/* ANSWER OPTIONS */
.options-container {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.option {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid #394265;
    border-radius: 13px;
    color: #e2e8f0;
    font-family: inherit;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s ease;
}

.option:hover:not(:disabled) {
    background: rgba(124,58,237,0.18);
    border-color: #a78bfa;
    transform: translateX(5px);
}

.option-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 39px;
    height: 39px;
    flex-shrink: 0;
    background: #30375c;
    color: #c4b5fd;
    border-radius: 10px;
    font-weight: 700;
}

.option.selected {
    background: rgba(124,58,237,0.25);
    border-color: #a78bfa;
}

.option.selected .option-letter {
    background: #8b5cf6;
    color: white;
}

.option.correct {
    background: rgba(34,197,94,0.16);
    border-color: #4ade80;
}

.option.correct .option-letter {
    background: #16a34a;
    color: white;
}

.option.wrong {
    background: rgba(239,68,68,0.15);
    border-color: #f87171;
}

.option.wrong .option-letter {
    background: #dc2626;
    color: white;
}

.option:disabled {
    cursor: default;
}

/* FEEDBACK */
.feedback {
    min-height: 25px;
    margin-top: 18px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
}

/* NEXT BUTTON */
.next-button {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 18px;
    background: linear-gradient(
        90deg, #7c3aed, #0891b2
    );
    color: white;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.next-button:hover {
    box-shadow: 0 0 25px rgba(124,58,237,0.45);
    transform: translateY(-2px);
}

/* RESULT SCREEN */
.result-screen {
    display: none;
    text-align: center;
    padding: 20px 0;
}

.result-icon {
    font-size: 75px;
    margin-bottom: 18px;
}

.result-screen h2 {
    font-size: 32px;
    margin-bottom: 12px;
    color: #c4b5fd;
}

.result-score {
    font-size: 55px;
    font-weight: 800;
    color: #67e8f9;
    margin: 22px 0;
}

.result-message {
    color: #cbd5e1;
    font-size: 17px;
    line-height: 1.7;
}

/* FOOTER */
.footer {
    text-align: center;
    margin-top: 22px;
    color: #8190b5;
    font-size: 13px;
}

/* RESPONSIVE DESIGN */
@media(max-width: 600px) {
    .quiz-card {
        padding: 25px 19px;
        border-radius: 18px;
    }

    .brand h1 {
        font-size: 29px;
    }

    .question-text {
        font-size: 22px;
        min-height: auto;
    }

    .option {
        font-size: 14px;
    }

    .quiz-top {
        gap: 10px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="orb orb-one"></div>
<div class="orb orb-two"></div>

<div class="quiz-wrapper">

    <!-- BRAND -->
    <div class="brand">
        <div class="brand-icon">🪐</div>
        <h1>COSMOQUEST</h1>
        <p>Explore the Universe • Test Your Knowledge</p>
    </div>

    <!-- QUIZ CARD -->
    <div class="quiz-card">

        <div id="quizContent">

            <!-- QUESTION AND SCORE -->
            <div class="quiz-top">
                <span class="question-count"
                      id="questionCount">
                    Question 01 / 08
                </span>

                <div class="score-box">
                    <span>⭐ Score</span>
                    <strong id="scoreDisplay">0</strong>
                </div>
            </div>

            <!-- PROGRESS -->
            <div class="progress-track">
                <div class="progress-fill"
                     id="progressFill"></div>
            </div>

            <!-- QUESTION -->
            <p class="question-label">
                SPACE KNOWLEDGE CHALLENGE
            </p>

            <h2 class="question-text"
                id="questionText"></h2>

            <!-- OPTIONS -->
            <div class="options-container"
                 id="optionsContainer"></div>

            <!-- FEEDBACK -->
            <p class="feedback"
               id="feedbackMessage"
               aria-live="polite"></p>

            <!-- BUTTON -->
            <button class="next-button"
                    id="nextButton"
                    onclick="handleNextQuestion()">
                Check Answer
            </button>

        </div>

        <!-- RESULT SCREEN -->
        <div class="result-screen" id="resultScreen">
            <div class="result-icon">🏆</div>
            <h2>Mission Complete!</h2>
            <p>You have finished your space journey.</p>

            <div class="result-score" id="finalScore">
                0 / 8
            </div>

            <p class="result-message"
               id="resultMessage"></p>

            <button class="next-button"
                    onclick="restartQuiz()">
                🚀 Play Again
            </button>
        </div>

    </div>

    <p class="footer">
        © 2026 CosmoQuest • Journey Beyond the Stars
    </p>

</div>

<script>

/* SPACE QUIZ QUESTIONS */
const spaceQuizQuestions = [
    {
        question: "Which planet is known as the Red Planet?",
        options: ["Venus", "Mars", "Jupiter", "Mercury"],
        answer: 1
    },
    {
        question: "What is the largest planet in our Solar System?",
        options: ["Earth", "Saturn", "Jupiter", "Neptune"],
        answer: 2
    },
    {
        question: "Which star is at the center of our Solar System?",
        options: ["Sirius", "Polaris", "The Sun", "Betelgeuse"],
        answer: 2
    },
    {
        question: "What is the name of our galaxy?",
        options: [
            "Andromeda",
            "Milky Way",
            "Whirlpool",
            "Sombrero"
        ],
        answer: 1
    },
    {
        question: "Which planet is famous for its rings?",
        options: ["Mars", "Venus", "Saturn", "Earth"],
        answer: 2
    },
    {
        question: "Who was the first human to travel into space?",
        options: [
            "Neil Armstrong",
            "Yuri Gagarin",
            "Buzz Aldrin",
            "Alan Shepard"
        ],
        answer: 1
    },
    {
        question: "What is the closest planet to the Sun?",
        options: ["Venus", "Earth", "Mercury", "Mars"],
        answer: 2
    },
    {
        question: "What is Earth's natural satellite?",
        options: ["Titan", "Europa", "The Moon", "Phobos"],
        answer: 2
    }
];

/* VARIABLES */
let currentQuestionIndex = 0;
let totalScore = 0;
let selectedAnswerIndex = null;
let answerChecked = false;

/* SELECT ELEMENTS */
const questionCount =
    document.getElementById("questionCount");

const scoreDisplay =
    document.getElementById("scoreDisplay");

const progressFill =
    document.getElementById("progressFill");

const questionText =
    document.getElementById("questionText");

const optionsContainer =
    document.getElementById("optionsContainer");

const feedbackMessage =
    document.getElementById("feedbackMessage");

const nextButton =
    document.getElementById("nextButton");

const quizContent =
    document.getElementById("quizContent");

const resultScreen =
    document.getElementById("resultScreen");

const finalScore =
    document.getElementById("finalScore");

const resultMessage =
    document.getElementById("resultMessage");

/* CREATE ANIMATED STARS */
function createStars() {
    const starsContainer =
        document.getElementById("stars");

    for (let i = 0; i < 85; i++) {
        const star = document.createElement("span");
        star.className = "star";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";

        star.style.animationDelay =
            Math.random() * 4 + "s";

        star.style.animationDuration =
            (2 + Math.random() * 3) + "s";

        starsContainer.appendChild(star);
    }
}

/* LOAD QUESTION */
function loadQuestion() {
    selectedAnswerIndex = null;
    answerChecked = false;

    feedbackMessage.textContent = "";
    nextButton.textContent = "Check Answer";

    const currentQuestion =
        spaceQuizQuestions[currentQuestionIndex];

    questionCount.textContent =
        "Question " +
        String(currentQuestionIndex + 1).padStart(2, "0") +
        " / " +
        String(spaceQuizQuestions.length).padStart(2, "0");

    scoreDisplay.textContent = totalScore;

    progressFill.style.width =
        ((currentQuestionIndex + 1) /
        spaceQuizQuestions.length * 100) + "%";

    questionText.textContent =
        currentQuestion.question;

    optionsContainer.innerHTML = "";

    currentQuestion.options.forEach(
        function(optionText, index) {

            const optionButton =
                document.createElement("button");

            optionButton.className = "option";
            optionButton.type = "button";

            const optionLetter =
                document.createElement("span");

            optionLetter.className = "option-letter";
            optionLetter.textContent =
                String.fromCharCode(65 + index);

            const optionLabel =
                document.createElement("span");

            optionLabel.textContent = optionText;

            optionButton.appendChild(optionLetter);
            optionButton.appendChild(optionLabel);

            optionButton.addEventListener(
                "click",
                function() {
                    if (answerChecked) return;

                    selectedAnswerIndex = index;

                    document.querySelectorAll(".option")
                        .forEach(function(button) {
                            button.classList.remove("selected");
                        });

                    optionButton.classList.add("selected");
                    feedbackMessage.textContent = "";
                }
            );

            optionsContainer.appendChild(optionButton);
        }
    );
}

/* CHECK ANSWER OR MOVE TO NEXT QUESTION */
function handleNextQuestion() {
    if (!answerChecked) {
        if (selectedAnswerIndex === null) {
            feedbackMessage.style.color = "#fca5a5";
            feedbackMessage.textContent =
                "Please choose an answer first.";
            return;
        }

        checkAnswer();
        return;
    }

    currentQuestionIndex++;

    if (currentQuestionIndex < spaceQuizQuestions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

/* CHECK SELECTED ANSWER */
function checkAnswer() {
    const currentQuestion =
        spaceQuizQuestions[currentQuestionIndex];

    const correctIndex = currentQuestion.answer;

    answerChecked = true;

    const optionButtons =
        document.querySelectorAll(".option");

    optionButtons.forEach(function(button, index) {
        button.disabled = true;

        if (index === correctIndex) {
            button.classList.add("correct");
        }

        if (
            index === selectedAnswerIndex &&
            index !== correctIndex
        ) {
            button.classList.add("wrong");
        }
    });

    if (selectedAnswerIndex === correctIndex) {
        totalScore++;
        feedbackMessage.style.color = "#4ade80";
        feedbackMessage.textContent =
            "✨ Correct! Excellent work, explorer!";
    } else {
        feedbackMessage.style.color = "#fca5a5";
        feedbackMessage.textContent =
            "Not quite! The correct answer is " +
            currentQuestion.options[correctIndex] + ".";
    }

    scoreDisplay.textContent = totalScore;

    nextButton.textContent =
        currentQuestionIndex === spaceQuizQuestions.length - 1
            ? "View My Results"
            : "Next Question →";
}

/* SHOW FINAL RESULT */
function showResults() {
    quizContent.style.display = "none";
    resultScreen.style.display = "block";

    finalScore.textContent =
        totalScore + " / " + spaceQuizQuestions.length;

    const percentage =
        totalScore / spaceQuizQuestions.length * 100;

    if (percentage === 100) {
        resultMessage.textContent =
            "🌟 Perfect score! You're a true space expert!";
    } else if (percentage >= 60) {
        resultMessage.textContent =
            "🚀 Great mission! You know a lot about space!";
    } else {
        resultMessage.textContent =
            "🌙 Keep exploring! Every mission teaches something new.";
    }
}

/* RESTART QUIZ */
function restartQuiz() {
    currentQuestionIndex = 0;
    totalScore = 0;
    selectedAnswerIndex = null;
    answerChecked = false;

    quizContent.style.display = "block";
    resultScreen.style.display = "none";

    loadQuestion();
}

/* INITIALIZE WEBSITE */
createStars();
loadQuestion();

</script>

</body>
</html>
